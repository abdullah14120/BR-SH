name: Build Android APK (Legacy Fix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # استخدام 17 لإرضاء النظام وتشغيل Gradle الأساسي
        distribution: 'temurin'
        cache: gradle

    # توليد الـ Wrapper القديم باستخدام Java 17
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 7.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # الآن تشغيل البناء باستخدام الـ Wrapper الذي تم توليده
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BR-SH-Final-Build
        path: app/build/outputs/apk/debug/app-debug.apk
