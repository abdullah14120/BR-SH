name: Build Android APK (Stable Mode)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # يسمح لك بتشغيل البناء يدوياً من تبويب Actions
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # توليد ملفات الـ Wrapper للإصدار المستقر 7.5
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 7.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # تشغيل عملية البناء
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # رفع ملف الـ APK الناتج
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BR-SH-Stable-Build
        path: app/build/outputs/apk/debug/app-debug.apk
