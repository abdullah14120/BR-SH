name: Build Android APK (Direct Mode)

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # سنستخدم 'gradle' المثبت مسبقاً في النظام مباشرة بدلاً من './gradlew'
    - name: Build with Gradle
      run: gradle assembleDebug
